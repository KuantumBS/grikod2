[workspace]
preview = ["pixi-build"]
authors = ["Mehmet Keçeci <mkececi@yaani.com>"]
channels = ["pypi", "https://prefix.dev/conda-forge", "https://conda.modular.com/max-nightly", "conda-forge", "https://repo.prefix.dev/modular-community"]
platforms = ["linux-64"]
name = "grikod2"
version = "1.1.5"

[package]
name = "grikod2"
version = "1.1.5"
license = "AGPL-3.0-or-later"

[dependencies]
python = ">=3.11"
pip = ">=25.3"
conda-build = ">=26.3.0"
setuptools = ">=82.0.1"
wheel = ">=0.47.0"
hatchling = ">=1.29.0"
setuptools_scm = ">=9.2.2"
rattler-build = ">=0.67.0"
numpy = ">=2.4.6"

[tasks]
build = "python -m build"
start = "python -c 'import grikod2; print(grikod2.__version__)'"
lint = "ruff check ."
fmt = "ruff format ."
serve = { cmd = "python -m http.server", cwd = "docs" }
install-grikod2 = "pip install git+https://github.com/WhiteSymmetry/grikod2"
install = "pip install -e ."
test = { depends-on = ["install"], cmd = "pytest" }
install-deps = "pip install grikod2"

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
hatchling = "*"
