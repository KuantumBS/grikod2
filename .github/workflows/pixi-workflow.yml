name: Pixi CI

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
      fail-fast: false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🚀 Install Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: "latest"
          cache: false
          frozen: false

      - name: 🧠 Cache Pixi environments & cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pixi
            ~/.pixi/envs
          key: ${{ runner.os }}-pixi-${{ hashFiles('pixi.lock') }}
          restore-keys: |
            ${{ runner.os }}-pixi-

      - name: 📦 Install dependencies
        run: pixi install --frozen

      - name: 🔧 Install package in editable mode
        run: pixi run pip install -e .

      - name: 🧪 Run tests
        run: pixi run test

      - name: 🏗️ Build package (wheel + sdist)
        run: |
          # build aracını kur
          pixi run pip install build
          # Kaynak ve tekerlek oluştur
          pixi run python -m build --sdist --wheel
        # Alternatif: pixi.toml'da build görevi tanımlıysa:
        # run: pixi run build

      - name: 📋 List dist/ contents (debug)
        run: ls -la dist/ || echo "dist/ dizini boş veya yok"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: grikod2-dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error  # Hata vermesi için 'error' yapın

      - name: 🏗️ Paket Derle ve prefix.dev'e Yayınla (Trusted Publishing)
        run: pixi publish --target-channel https://prefix.dev/bilgi
